<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Senha</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="assets/img/faviconn.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/app.css" />
  </head>
<body class="auth-bg flex items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-md p-8">
    <div class="flex flex-col items-center space-y-6">
      
     
      <div class="bg-green-100 p-4 rounded-full flex items-center justify-center">
        <i class="fas fa-key text-green-600 text-4xl"></i>
      </div>

      <div class="text-center">
        <h1 class="text-2xl font-bold text-gray-800">Recuperar Senha</h1>
        <p class="text-gray-500 mt-1 text-sm">
          Digite seu email para receber instruções de recuperação
        </p>
      </div>

      
      <form id="recoverForm" class="auth-card p-6 sm:p-8 w-full space-y-4" novalidate>
        <p id="recoverMsg" class="hidden text-sm rounded-lg px-3 py-2" role="alert"></p>
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input 
            id="email" 
            type="email" 
            placeholder="seu@email.com" 
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
          >
        </div>

        <button 
          type="submit" 
          class="btn btn-primary w-full py-2.5"
        >
          Enviar Recuperação
        </button>

        <div class="text-center">
          <a href="login.html" class="inline-flex items-center text-green-600 hover:text-green-700 text-sm font-medium">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
            Voltar para login
          </a>
        </div>
      </form>
    </div>
  </div>

<script src="./assets/js/common.js"></script>
<script src="./assets/js/recover.js"></script>
</body>
</html>
