<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dados Ambientais - EcoVisão</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/app.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
      #map { height: 500px; border-radius: 0.75rem; position: relative; z-index: 1; }
      @media (max-width: 640px) { #map { height: 360px; } }
    </style>
    <style>@media print { #sidebar, #topbar, .no-print { display: none !important; } }</style>
    <link rel="icon" type="image/x-icon" href="assets/img/faviconn.svg" />
  </head>
  <body class="min-h-screen bg-gray-50 flex">
    <div id="sidebarBackdrop" class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden"></div>
    <aside id="sidebar"></aside>
    <main class="flex-1 flex flex-col min-w-0">
      <header id="topbar" class="bg-white px-4 sm:px-6 py-3.5 border-b border-gray-200 flex items-center justify-between gap-4 sticky top-0 z-30">
        <button id="openSidebar" class="lg:hidden" aria-label="Abrir menu"><i class="fas fa-bars w-6 h-6"></i></button>
        <h1 class="text-lg sm:text-xl font-bold text-gray-800">Dados Ambientais</h1>
        <span id="userEmail" class="text-sm text-gray-500 hidden sm:block"></span>
      </header>
      <div id="content" class="flex-1 p-4 sm:p-6 overflow-auto"><div class="max-w-6xl mx-auto">
        <div class="page-head"><p>Acompanhe as ocorrências ambientais registradas na região da Serra do Cipó.</p></div>
        <div id="typeTabs" class="flex flex-wrap gap-2 mb-6"></div>
        <div id="stats" class="grid grid-cols-1 md:grid-cols-3 gap-4 sm:gap-6 mb-6"><div class="skeleton h-28"></div><div class="skeleton h-28"></div><div class="skeleton h-28"></div></div>
        <div class="card mb-6">
          <h2 class="text-lg font-semibold text-gray-800 mb-4">Mapa Interativo</h2>
          <p id="mapError" class="hidden text-red-600 text-sm mb-2">Não foi possível carregar os dados do mapa. <button id="retryBtn" class="underline">Tentar novamente</button></p>
          <p id="mapEmpty" class="hidden text-gray-500 text-sm mb-2">Não existem ocorrências registradas para este filtro.</p>
          <div id="map"></div>
        </div>
        <div class="card">
          <h2 class="text-lg font-semibold text-gray-800 mb-4">Ocorrências Recentes</h2>
          <ul id="recentList" class="space-y-3"><div class="skeleton h-20 mb-3"></div><div class="skeleton h-20 mb-3"></div><div class="skeleton h-20"></div></ul>
        </div>
      </div></div>
    </main>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="./assets/js/common.js"></script>
    <script src="./assets/js/dashboard.js"></script>
  </body>
</html>
