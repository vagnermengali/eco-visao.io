<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fórum - EcoVisão</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/app.css" />
    <style>@media print { #sidebar, #topbar, .no-print { display: none !important; } }</style>
    <link rel="icon" type="image/x-icon" href="assets/img/faviconn.svg" />
  </head>
  <body class="min-h-screen bg-gray-50 flex">
    <div id="sidebarBackdrop" class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden"></div>
    <aside id="sidebar"></aside>
    <main class="flex-1 flex flex-col min-w-0">
      <header id="topbar" class="bg-white px-4 sm:px-6 py-3.5 border-b border-gray-200 flex items-center justify-between gap-4 sticky top-0 z-30">
        <button id="openSidebar" class="lg:hidden" aria-label="Abrir menu"><i class="fas fa-bars w-6 h-6"></i></button>
        <h1 class="text-lg sm:text-xl font-bold text-gray-800">Fórum da Comunidade</h1>
        <span id="userEmail" class="text-sm text-gray-500 hidden sm:block"></span>
      </header>
      <div id="content" class="flex-1 p-4 sm:p-6 overflow-auto"><div class="max-w-6xl mx-auto">
        <div class="page-head"><p>Troque informações com a comunidade sobre questões ambientais.</p></div>
        <section class="card mb-6">
          <h2 class="text-lg font-semibold text-gray-800 mb-3">Criar nova discussão</h2>
          <input id="postTitle" type="text" maxlength="100" placeholder="Título do tópico" class="w-full px-3 py-2 mb-3" />
          <textarea id="postContent" rows="4" placeholder="Descreva seu tópico..." class="w-full px-3 py-2 mb-3"></textarea>
          <p id="postError" class="hidden text-red-600 text-sm mb-2"></p>
          <button id="confirmPost" class="btn btn-primary"><i class="fas fa-paper-plane"></i> Publicar</button>
        </section>
        <p id="forumMsg" class="hidden text-gray-500 mb-4"></p>
        <section id="topicsList" class="space-y-4"><div class="skeleton h-20 mb-3"></div><div class="skeleton h-20 mb-3"></div><div class="skeleton h-20"></div></section>
      </div></div>
    </main>
    <script src="./assets/js/common.js"></script>
    <script src="./assets/js/forum.js"></script>
  </body>
</html>
