<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar Perfil - EcoVisão</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="icon" type="image/x-icon" href="assets/img/faviconn.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/app.css" />
  </head>
  <body class="min-h-screen bg-gray-50 flex">
    <div id="sidebarBackdrop" class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden"></div>
    <aside id="sidebar"></aside>
    <main class="flex-1 flex flex-col min-w-0">
      <header id="topbar" class="bg-white px-4 sm:px-6 py-3.5 border-b border-gray-200 flex items-center justify-between gap-4 sticky top-0 z-30">
        <button id="openSidebar" class="lg:hidden" aria-label="Abrir menu"><i class="fas fa-bars w-6 h-6"></i></button>
        <h1 class="text-lg sm:text-xl font-bold text-gray-800">Meu Perfil</h1>
        <span id="userEmail" class="text-sm text-gray-500 hidden sm:block"></span>
      </header>
      <div class="flex-1 p-4 sm:p-6"><div class="max-w-2xl mx-auto">
        <div class="page-head"><p>Atualize seus dados pessoais, foto e senha.</p></div>
        <div class="card sm:p-8">
        <form id="profileForm" class="space-y-8">
          <div class="flex flex-col items-center space-y-4">
            <div class="relative">
              <div
                class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center overflow-hidden shadow-md"
              >
                <img
                  id="profileImg"
                  src=""
                  alt="Imagem de perfil do usuário"
                  class="w-full h-full object-cover hidden"
                />
                <i
                  id="profilePlaceholder"
                  class="fas fa-user text-green-600 text-3xl"
                ></i>
              </div>
              <label
                class="flex items-center justify-center w-7 h-7 absolute bottom-0 right-0 bg-green-600 rounded-full p-2 cursor-pointer hover:bg-green-700 transition-colors text-white"
              >
                <i class="fas fa-camera"></i>
                <input
                  type="file"
                  accept="image/*"
                  id="imageUpload"
                  class="hidden"
                />
              </label>
            </div>
            <p class="text-sm text-gray-500">
              Clique na câmera para alterar sua foto de perfil
            </p>
          </div>
          <div class="space-y-6">
            <h3
              class="text-lg font-semibold text-gray-800 border-b border-gray-200 pb-2"
            >
              Informações Pessoais
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

              <div class="space-y-2">
                <label for="name" class="text-sm font-medium text-gray-700"
                  >Primeiro Nome</label
                >
                <div class="relative">
                  <i
                    class="fas fa-user absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"
                  ></i>
                  <input
                    type="text"
                    id="firstName"
                    placeholder="Seu primeiro nome"
                    class="w-full border border-gray-300 rounded-lg px-10 py-2 focus:ring-2 focus:ring-green-400 focus:outline-none"
                  />
                </div>
              </div>
              <div class="space-y-2">
                <label for="name" class="text-sm font-medium text-gray-700"
                  >Sobrenome</label
                >
                <div class="relative">
                  <i
                    class="fas fa-user absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"
                  ></i>
                  <input
                    type="text"
                    id="lastName"
                    placeholder="Seu sobrenome"
                    class="w-full border border-gray-300 rounded-lg px-10 py-2 focus:ring-2 focus:ring-green-400 focus:outline-none"
                  />
                </div>
              </div>

              <div class="space-y-2">
                <label for="email" class="text-sm font-medium text-gray-700"
                  >Email</label
                >
                
                <div class="relative">
                  <i
                    class="fas fa-envelope absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"
                  ></i>
                  <input
                    type="email"
                    id="email"
                    placeholder="seu@email.com"
                    class="w-full border border-gray-300 rounded-lg px-10 py-2 focus:ring-2 focus:ring-green-400 focus:outline-none"
                  />
                </div>
              </div>

              <div class="space-y-2">
                <label for="cpf" class="text-sm font-medium text-gray-700"
                  >CPF</label
                >
                <div class="relative">
                  <i
                    class="fas fa-id-card absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"
                  ></i>
                  <input
                    type="text"
                    id="cpf"
                    placeholder="Digite seu CPF"
                    class="w-full border border-gray-300 rounded-lg px-10 py-2 focus:ring-2 focus:ring-green-400 focus:outline-none"
                  />
                </div>
              </div>

              <div class="space-y-2">
                <label for="endereco" class="text-sm font-medium text-gray-700"
                  >Endereço</label
                >
                <div class="relative">
                  <i
                    class="fas fa-map-pin absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"
                  ></i>
                  <input
                    type="text"
                    id="endereco"
                    placeholder="Seu endereço completo"
                    class="w-full border border-gray-300 rounded-lg px-10 py-2 focus:ring-2 focus:ring-green-400 focus:outline-none"
                  />
                </div>
              </div>

              

              <div class="space-y-2">
                <label for="dataNascimento" class="text-sm font-medium text-gray-700"
                  >Data de Nascimento</label
                >
                <div class="relative">
                  <i
                    class="fa fa-calendar absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"
                  ></i>
                  <input
                    type="date"
                    id="dataNascimento"
                    placeholder="Digite seu dataNascimento"
                    class="w-full border border-gray-300 rounded-lg px-10 py-2 focus:ring-2 focus:ring-green-400 focus:outline-none"
                  />
                </div>
              </div>

            </div>
          </div>
          <div class="space-y-6">
            <h3
              class="text-lg font-semibold text-gray-800 border-b border-gray-200 pb-2"
            >
              Alterar Senha
            </h3>
            <div class="space-y-4">
              <div class="space-y-2">
                <label
                  for="currentPassword"
                  class="text-sm font-medium text-gray-700"
                  >Senha Atual</label
                >
                <div class="relative">
                  <i
                    class="fas fa-lock absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"
                  ></i>
                  <input
                    type="password"
                    id="currentPassword"
                    placeholder="Senha atual"
                    class="w-full border border-gray-300 rounded-lg px-10 py-2 focus:ring-2 focus:ring-green-400 focus:outline-none"
                  />
                </div>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="space-y-2">
                  <label
                    for="newPassword"
                    class="text-sm font-medium text-gray-700"
                    >Nova Senha</label
                  >
                  <div class="relative">
                    <i
                      class="fas fa-lock absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"
                    ></i>
                    <input
                      type="password"
                      id="newPassword"
                      placeholder="Nova senha"
                      class="w-full border border-gray-300 rounded-lg px-10 py-2 focus:ring-2 focus:ring-green-400 focus:outline-none"
                    />
                  </div>
                </div>
                <div class="space-y-2">
                  <label
                    for="confirmPassword"
                    class="text-sm font-medium text-gray-700"
                    >Confirmar Nova Senha</label
                  >
                  <div class="relative">
                    <i
                      class="fas fa-lock absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"
                    ></i>
                    <input
                      type="password"
                      id="confirmPassword"
                      placeholder="Confirmar nova senha"
                      class="w-full border border-gray-300 rounded-lg px-10 py-2 focus:ring-2 focus:ring-green-400 focus:outline-none"
                    />
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div
            id="successMsg"
            class="alert-success hidden text-center"
          >
            Perfil atualizado com sucesso!
          </div>
          <div class="flex gap-4 pt-4">
            <button
              type="submit"
              id="saveBtn"
              class="btn btn-primary flex-1 py-2.5"
            >
              <i class="fas fa-save hidden sm:block"></i> Salvar
            </button>
            <button
              type="button"
              id="cancelBtn"
              class="btn btn-secondary flex-1 py-2.5"
            >
              Cancelar
            </button>
          </div>
        </form>
      </div>
    </div></div>
    </main>
    <script src="assets/js/common.js"></script>
    <script src="assets/js/profile.js"></script>
    <script>if (getUserId()) renderSidebar("profile.html");</script>
  </body>
</html>
